# Amplifier Online (v2) manifest for context-intelligence.
# Upgraded from v1 (web-app-aca + auth.expose); the v1 file is amplifier-online.v1.yaml.
# Deploy: `amplifier-online deploy` (builds this repo through the platform pipeline).
#
# Auth: Container Apps built-in auth checks every bearer token (audience
# api://53aa4ffd-..., this tenant, and a caller listed in `accepts`) before the
# request reaches the server, which still validates the JWT itself (PyJWT) and
# authorizes by oid map and app roles. That platform check is what S360's MISE
# KPI sees. Any caller not in `accepts` gets 403 at the edge.
#
# Published through the shared gateway as before:
#   https://amplifier-online-apim.azure-api.net/context-intelligence
# and directly at https://context-intelligence-api.<env-default-domain>.

name: context-intelligence

services:
  api:
    build: .
    port: 8000
    size: xlarge          # 2 vCPU / 4 GiB, as on v1
    min_replicas: 1       # one queue writer, always on (WEB_CONCURRENCY=1, single /data writer)
    auth: token
    app_id: 53aa4ffd-fbea-40a3-b35c-63fdcb609af1   # existing registration "MADE: Team-Context-Intelligence", used as-is
    accepts:
      - azure-cli                              # people using the Context Intelligence bundle (az login)
      - b4ec27ea-ced5-4c44-b2d5-0f7c32e9cc02   # Team Pulse (managed identity id-team-pulse-resolve)
      - dea6e881-4cd8-4aba-87da-a52ff3e19bce   # Team Pulse - Web (app registration, formerly "Made Dashboard")
      - 7bf3bc4d-008a-43dc-a354-56d690d333cd   # Resolve prod (managed identity resolve-aca-uami-ci)
      - 09338c81-5aee-49bc-8e75-5edaae3198e0   # Resolve staging (managed identity resolve-aca-staging-uami-ci)
      - c5c172f8-412d-4805-96ab-73fdc6e72797   # Devis's dev box VM (managed identity, devis-vms)
    auth_exclude: [/status, /version, /docs, /openapi.json]   # the server's own unauthenticated paths (/health is always open)

    # Persistent /data: oid->contributor store, durable queues, blobs, logs.
    # The live share is 2048 GiB (Premium); a share can't shrink, and adoption
    # refuses a smaller size. Raise this (max 5120) before it fills.
    volume:
      mount_path: /data
      size_gib: 2048
      tier: premium

    env:
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_AUTH_MODE: entra
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_AZURE_CLIENT_ID: 53aa4ffd-fbea-40a3-b35c-63fdcb609af1
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_AZURE_TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_ENTRA_ADMIN_ROLE: IdentityAdmin
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_ENTRA_IDENTITIES_STORE_PATH: /data/identity/entra-identities.json
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_QUEUES_PATH: /data/queues
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_BLOB_PATH: /data/blobs
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_LOG_PATH: /data/logs/server.jsonl
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_WEB_UI_ENABLED: "false"
      WEB_CONCURRENCY: "1"    # required by the durable single-writer protocol
      # Neo4j (context-intelligence-neo4j VM, outside AO, same VNet): two logical
      # clients on one instance; credentials come from the secrets below.
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J_REQUIRE_EXPLICIT_CLIENTS: "true"
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__ADMIN__URL: bolt://10.100.4.4:7687
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__ADMIN__ACCESS_MODE: WRITE
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__CYPHER_QUERY__URL: bolt://10.100.4.4:7687
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__CYPHER_QUERY__ACCESS_MODE: READ

# Neo4j credentials, no longer wired by hand after each deploy: set once with
#   amplifier-online secret set neo4j-user
#   amplifier-online secret set neo4j-password
# (values from kv-context-intel's context-intelligence-neo4j-user / -password).
secrets:
  - {name: AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__ADMIN__USERNAME, keyVaultSecret: neo4j-user, service: api}
  - {name: AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__ADMIN__PASSWORD, keyVaultSecret: neo4j-password, service: api}
  - {name: AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__CYPHER_QUERY__USERNAME, keyVaultSecret: neo4j-user, service: api}
  - {name: AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J__CYPHER_QUERY__PASSWORD, keyVaultSecret: neo4j-password, service: api}
