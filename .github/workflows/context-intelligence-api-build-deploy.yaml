name: context-intelligence API Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'context_intelligence_server/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements-mise.txt'
  # Nightly OS-patch refresh. The image floats its Azure Linux base and runs
  # `tdnf update` at build time, but that layer is cache-keyed on its instruction
  # text, so without a periodic cache bust it stops absorbing patches while the
  # Trivy gate keeps scanning against a fresh vuln DB -- main goes red with no
  # code change. This run pays the rebuild unattended and republishes
  # :buildcache, so the day's merges stay fast AND current. A new CVE with no
  # available fix surfaces here at 03:00 UTC instead of ambushing the next merge.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-api

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check CFS configuration
        env:
          CFS_AZURE_CLIENT_ID: ${{ vars.CFS_AZURE_CLIENT_ID }}
          CFS_AZURE_TENANT_ID: ${{ vars.CFS_AZURE_TENANT_ID }}
          CFS_PYTHON_INDEX_URL: ${{ secrets.CFS_PYTHON_INDEX_URL }}
        run: |
          python3 - <<'PY'
          import os

          for name in ("CFS_AZURE_CLIENT_ID", "CFS_AZURE_TENANT_ID", "CFS_PYTHON_INDEX_URL"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Missing required CFS configuration: {name}")
          PY

      - name: Log in to Azure for CFS
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.CFS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CFS_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Set up CFS
        uses: 1es-actions/setup-cfs@ca9f87a2de7ac289f170105e79a9d2e68ac6ce32 # v1.1

      - name: Write CFS BuildKit secrets
        env:
          CFS_PYTHON_INDEX_URL: ${{ secrets.CFS_PYTHON_INDEX_URL }}
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          token = os.environ.get("CFS_ACCESSTOKEN", "")
          if not token.strip():
              raise SystemExit("Missing CFS_ACCESSTOKEN")
          index_url = os.environ.get("CFS_PYTHON_INDEX_URL", "")
          try:
              url = urlsplit(index_url)
              _ = url.port
              valid = (
                  url.scheme == "https" and bool(url.hostname)
                  and url.username is None and url.password is None
                  and "?" not in index_url and "#" not in index_url
                  and not any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in index_url)
              )
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit(
                  "Invalid CFS_PYTHON_INDEX_URL: require HTTPS without credentials, query, or fragment"
              )
          config = (
              '[[index]]\nname = "cfs"\n'
              f'url = {json.dumps(index_url)}\n'
              'default = true\nauthenticate = "always"\n'
          )
          for filename, contents in (("cfs-uv.toml", config), ("cfs-token", token)):
              fd = os.open(
                  Path(os.environ["RUNNER_TEMP"]) / filename,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL,
                  0o600,
              )
              with os.fdopen(fd, "w", encoding="utf-8") as stream:
                  stream.write(contents)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # UTC date, not run id: busting per-run would rebuild the OS layer (and
      # every layer after it, including `uv pip install`) on every single merge.
      # Per-day means the first build of the day pays ~+2 min and the rest of the
      # day's builds hit the refreshed cache. See Dockerfile ARG OS_PATCH_EPOCH.
      - name: Compute OS patch epoch (daily cache bust)
        id: epoch
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            OS_PATCH_EPOCH=${{ steps.epoch.outputs.day }}
          secret-files: |
            cfs_config=${{ runner.temp }}/cfs-uv.toml
            cfs_token=${{ runner.temp }}/cfs-token
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Smoke test native MISE
        env:
          MISE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --network none --entrypoint python3 -i "$MISE_IMAGE" - <<'PY'
          import json
          import traceback
          from importlib.metadata import version

          from context_intelligence_server.mise_validation import (
              MiseTokenValidator,
              TokenValidationError,
          )

          client_id = "aaaaaaaa-0000-0000-0000-000000000001"
          tenant_id = "bbbbbbbb-0000-0000-0000-000000000002"
          bearer = "not-a-jwt"
          try:
              import mise

              assert version("mise") == "2.7.0"
              client = mise.Mise()
              configuration = {
                  "MiseVersion": "2.0",
                  "AzureAd": {
                      "Instance": "https://login.microsoftonline.com/",
                      "ClientId": client_id,
                      "TenantId": tenant_id,
                      "ValidTenantIds": [tenant_id],
                      "Audiences": [client_id, f"api://{client_id}"],
                      "Protocols": {
                          "Bearer": {
                              "TokenTypes": {
                                  "AccessToken": {"UserToken": True, "AppToken": True}
                              }
                          }
                      },
                  },
              }
              with client.configure(json.dumps(configuration), "AzureAd") as result:
                  assert result.error_code == 0
              validation_input = mise.MiseValidationInput()
              validation_input.authorization_header = f"Bearer {bearer}"
              validation_input.original_uri_header = "https://service.example.test/events"
              validation_input.original_method_header = "POST"
              with client.validate(validation_input=validation_input) as result:
                  assert result.http_response_status_code == 401
                  assert result.subject_claims == []
          except Exception:  # noqa: BLE001 - Never emit SDK/native diagnostics.
              raise SystemExit("Native MISE smoke failed") from None

          validator = MiseTokenValidator(client_id, tenant_id)
          try:
              validator.validate(
                  bearer,
                  original_uri="https://service.example.test/events",
                  original_method="POST",
              )
          except TokenValidationError as error:
              assert str(error) == "Token validation failed"
              assert error.__cause__ is None and error.__suppress_context__
              rendered = "".join(traceback.format_exception(error))
              assert client_id not in rendered and tenant_id not in rendered
              assert bearer not in rendered
          else:
              raise AssertionError("MISE accepted a malformed bearer")
          PY

      # Pinned to a SHA like every other action here, so Dependabot's existing
      # github-actions group proposes upgrades on a reviewable schedule instead of
      # this workflow silently tracking upstream master. NOTE: pinning the ACTION
      # does not pin Trivy's vulnerability DB -- that is still fetched fresh at
      # run time, by design. Currency of the image, not of the action, is what
      # keeps this gate green.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          artifact-name: sbom-api.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: "${{ env.IMAGE_NAME }}"
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Remove CFS BuildKit secrets
        if: always()
        run: rm -f -- "$RUNNER_TEMP/cfs-uv.toml" "$RUNNER_TEMP/cfs-token"

  deploy:
    needs: build
    # The nightly run exists to refresh the image and the buildcache, NOT to ship
    # unattended at 03:00. Deploys stay tied to a merge or an explicit manual run.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get OIDC token for provisioner
        id: oidc
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const token = await core.getIDToken('${{ vars.AO_PROVISIONER_AUDIENCE }}');
            core.setOutput('token', token);

      - name: Deploy via provisioner
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stateless deploy: send the manifest from the checked-out repo so the
          # provisioner does not need a server-side copy.
          MANIFEST_JSON=$(yq -o=json '.' amplifier-online.yaml)
          curl -sf -X POST \
            "${{ vars.AO_PROVISIONER_URL }}/deploy/projects/${{ vars.AO_PROJECT_NAME }}" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg image "$DEPLOY_IMAGE" \
              --arg service "api" \
              --arg ghcr "$GHCR_TOKEN" \
              --argjson manifest "$MANIFEST_JSON" \
              '{image: $image, service: $service, ghcr_token: $ghcr, manifest: $manifest}')"
