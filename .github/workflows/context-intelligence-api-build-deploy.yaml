name: context-intelligence API Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'context_intelligence_server/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'amplifier-online.yaml'
  # Nightly OS-patch refresh. The image floats its Azure Linux base and runs
  # `tdnf update` at build time, but that layer is cache-keyed on its instruction
  # text, so without a periodic cache bust it stops absorbing patches while the
  # Trivy gate keeps scanning against a fresh vuln DB -- main goes red with no
  # code change. This run pays the rebuild unattended and republishes
  # :buildcache, so the day's merges stay fast AND current. A new CVE with no
  # available fix surfaces here at 03:00 UTC instead of ambushing the next merge.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-api

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # UTC date, not run id: busting per-run would rebuild the OS layer (and
      # every layer after it, including `uv pip install`) on every single merge.
      # Per-day means the first build of the day pays ~+2 min and the rest of the
      # day's builds hit the refreshed cache. See Dockerfile ARG OS_PATCH_EPOCH.
      - name: Compute OS patch epoch (daily cache bust)
        id: epoch
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            OS_PATCH_EPOCH=${{ steps.epoch.outputs.day }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Packaging only: no sidecar is provisioned or authenticated by this smoke.
      - name: Smoke test server image (SDK-free)
        env:
          SERVER_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          name="server-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { timeout 15 docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          timeout 120 docker pull "$SERVER_IMAGE"
          timeout 60 docker run --rm --pull never --name "$name" \
            --label "ci.server-smoke=$name" --network none --memory 512m --cpus 1 \
            --entrypoint python3 -i "$SERVER_IMAGE" - <<'PY'
          import hashlib
          import http.client
          import os
          import tempfile
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path
          from unittest.mock import patch

          assert version("context-intelligence-server") == "6.11.2"
          assert find_spec("mise") is None
          assert find_spec("jwt") is None
          with tempfile.TemporaryDirectory() as root:
              prefix = "AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_"
              with patch.dict(os.environ, {
                  prefix + "AUTH_MODE": "static",
                  prefix + "API_KEY": "image-smoke-throwaway-key",
                  prefix + "ALLOW_UNAUTHENTICATED": "false",
                  prefix + "API_KEYS_STORE_PATH": str(Path(root) / "keys.json"),
                  prefix + "ENTRA_IDENTITIES_STORE_PATH": str(Path(root) / "identities.json"),
                  prefix + "LOG_PATH": str(Path(root) / "server.jsonl"),
              }), patch.object(http.client, "HTTPConnection", side_effect=AssertionError("Unexpected HTTP")):
                  from context_intelligence_server import mise_validation
                  from context_intelligence_server.config import Settings
                  from context_intelligence_server.main import create_asgi_app

                  assert mise_validation.MiseTokenValidator
                  app = create_asgi_app(Settings(
                      auth_mode="static",
                      api_keys={hashlib.sha256(b"image-smoke-throwaway-key").hexdigest(): {"id": "smoke"}},
                      allow_unauthenticated=False,
                      api_keys_store_path=str(Path(root) / "static.json"),
                      entra_identities_store_path=str(Path(root) / "entra.json"),
                  ))
                  assert callable(app)
          print("SDK-free static application construction passed; no sidecar proof")
          PY

      # Pinned to a SHA like every other action here, so Dependabot's existing
      # github-actions group proposes upgrades on a reviewable schedule instead of
      # this workflow silently tracking upstream master. NOTE: pinning the ACTION
      # does not pin Trivy's vulnerability DB -- that is still fetched fresh at
      # run time, by design. Currency of the image, not of the action, is what
      # keeps this gate green.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          artifact-name: sbom-api.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: "${{ env.IMAGE_NAME }}"
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build
    # The nightly run exists to refresh the image and the buildcache, NOT to ship
    # unattended at 03:00. Deploys stay tied to a merge or an explicit manual run.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get OIDC token for provisioner
        id: oidc
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const token = await core.getIDToken('${{ vars.AO_PROVISIONER_AUDIENCE }}');
            core.setOutput('token', token);

      - name: Deploy via provisioner
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stateless deploy: send the manifest from the checked-out repo so the
          # provisioner does not need a server-side copy.
          MANIFEST_JSON=$(yq -o=json '.' amplifier-online.yaml)
          curl -sf -X POST \
            "${{ vars.AO_PROVISIONER_URL }}/deploy/projects/${{ vars.AO_PROJECT_NAME }}" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg image "$DEPLOY_IMAGE" \
              --arg service "api" \
              --arg ghcr "$GHCR_TOKEN" \
              --argjson manifest "$MANIFEST_JSON" \
              '{image: $image, service: $service, ghcr_token: $ghcr, manifest: $manifest}')"
