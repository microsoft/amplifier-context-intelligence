name: M2 Auth — Live-Token Acceptance Gate

# Manual only. This gate does not provision MISE or configure its tenant/resource.
# A separately configured sidecar must already be reachable on this runner at
# 127.0.0.1:5000. The default hosted runner does not provide one: prerequisites
# fail before credential acquisition, never a skipped/green acceptance claim.
# See docs/m2-auth-acceptance.md. Historical runs predate the sidecar boundary.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: m2-auth-acceptance
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight — verify required repo Variables
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check resource and expected caller identity
        id: check
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ACCEPTANCE_EXPECTED_OID: ${{ vars.ACCEPTANCE_EXPECTED_OID }}
          ACCEPTANCE_CONTRIBUTOR_ID: ${{ vars.ACCEPTANCE_CONTRIBUTOR_ID }}
          ACCEPTANCE_SERVER_URL: ${{ vars.ACCEPTANCE_SERVER_URL }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit
          from uuid import UUID

          for name in ("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "ACCEPTANCE_EXPECTED_OID"):
              try:
                  value = UUID(os.environ[name])
                  assert value.int != 0
              except (ValueError, AssertionError):
                  raise SystemExit(f"Missing/invalid {name}; configure prerequisites in docs/m2-auth-acceptance.md") from None
          if not re.fullmatch(r"[A-Za-z0-9_-]{1,100}", os.environ["ACCEPTANCE_CONTRIBUTOR_ID"]):
              raise SystemExit("Set ACCEPTANCE_CONTRIBUTOR_ID to the expected mapped contributor handle")
          server_url = os.environ.get("ACCEPTANCE_SERVER_URL", "")
          if server_url:
              url = urlsplit(server_url)
              if (url.scheme != "https" or not url.hostname or url.username or url.password
                  or url.query or url.fragment or any(c.isspace() for c in server_url)):
                  raise SystemExit("ACCEPTANCE_SERVER_URL must be HTTPS without credentials, query, or fragment")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("proceed=true\n")
          PY

  acceptance-gate:
    name: STEP A (gate) + STEP B/C (optional E2E)
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ACCEPTANCE_EXPECTED_OID: ${{ vars.ACCEPTANCE_EXPECTED_OID }}
      ACCEPTANCE_CONTRIBUTOR_ID: ${{ vars.ACCEPTANCE_CONTRIBUTOR_ID }}
      SERVICE_DATA_ROLE: ${{ vars.ACCEPTANCE_SERVICE_DATA_ROLE || 'Contributor' }}
      READER_ROLE: ${{ vars.ACCEPTANCE_READER_ROLE || 'Reader' }}
      ADMIN_ROLE: ${{ vars.ACCEPTANCE_ADMIN_ROLE || 'IdentityAdmin' }}
      SERVER_URL: ${{ vars.ACCEPTANCE_SERVER_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check configured localhost sidecar prerequisites
        run: |
          python3 - <<'PY'
          from http.client import HTTPConnection

          try:
              for method, path, expected in (
                  ("GET", "/readyz", 200),
                  ("POST", "/ValidateRequest", 401),
              ):
                  connection = HTTPConnection("127.0.0.1", 5000, timeout=3)
                  try:
                      connection.request(method, path, headers={
                          "Authorization": "Bearer not-a-jwt",
                          "original-uri": "https://service.example.test/events",
                          "original-method": "POST",
                          "return-all-subject-token-claims": "1",
                      })
                      response = connection.getresponse()
                      assert response.status == expected
                  finally:
                      connection.close()
          except Exception:
              raise SystemExit(
                  "Configured localhost MISE sidecar prerequisite missing or failed. "
                  "This workflow provisions no sidecar; the default hosted runner has none. "
                  "Arrange supported runner-side wiring before dispatch; see docs/m2-auth-acceptance.md."
              ) from None
          print("Sidecar reachable and malformed token rejected; NOT signing-key readiness or positive-token proof")
          PY

      - name: Azure login (OIDC federated credential, caller identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CALLER_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Acquire access token for the configured resource
        id: get_token
        run: |
          TOKEN=$(az account get-access-token --scope "api://${AZURE_CLIENT_ID}/.default" --query accessToken -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "::error::No token returned; check federation and resource configuration."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Shape inspection is not authenticity; A.2 must independently validate.
      - name: "STEP A.1 (THE GATE): decode + assert real token shape"
        id: assert_shape
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          try:
              parts = os.environ["TOKEN"].split(".")
              assert len(parts) == 3
              claims = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              assert not claims.get("scp")
              idtyp = claims.get("idtyp")
              assert (isinstance(idtyp, str) and idtyp.strip().lower() == "app") or claims.get("appidacr") is not None or claims.get("appid") or claims.get("azp")
              assert isinstance(claims.get("roles"), list)
              assert set(claims["roles"]) & {os.environ["SERVICE_DATA_ROLE"], os.environ["READER_ROLE"], os.environ["ADMIN_ROLE"]}
              assert claims.get("oid", "").lower() == os.environ["ACCEPTANCE_EXPECTED_OID"].lower()
          except Exception:
              raise SystemExit("Real-token shape/expected identity assertions failed (claims withheld)") from None
          print("ALL CLAIM-SHAPE ASSERTIONS PASSED; scp absent; qualifying role and expected oid present")
          PY

      - name: "STEP A.2 (THE GATE): real EntraResolver.resolve() against the live token"
        id: assert_resolver
        run: |
          uv run --locked python - <<'PY'
          import os

          from context_intelligence_server.auth import EntraResolver

          expected_oid = os.environ["ACCEPTANCE_EXPECTED_OID"].lower()
          expected_created_by = os.environ["ACCEPTANCE_CONTRIBUTOR_ID"]
          expected_identity_map = {expected_oid: expected_created_by}
          try:
              resolver = EntraResolver(
                  client_id=os.environ["AZURE_CLIENT_ID"],
                  tenant_id=os.environ["AZURE_TENANT_ID"],
                  identity_map=expected_identity_map,
                  service_identity_map=expected_identity_map,
                  service_data_role=os.environ["SERVICE_DATA_ROLE"],
                  reader_role=os.environ["READER_ROLE"],
                  entra_admin_role=os.environ["ADMIN_ROLE"],
              )
              contributor_id, roles, is_service = resolver.resolve(
                  os.environ["TOKEN"],
                  original_uri="https://service.example.test/events",
                  original_method="POST",
              )
              assert is_service
              assert contributor_id == expected_created_by
          except Exception:
              raise SystemExit("Live MISE/resolver acceptance failed (token and diagnostics withheld)") from None
          print("Resolver ACCEPTED the live token; mapped identity matches; is_service=True")
          PY

      - name: "STEP B (optional): POST /events against ACCEPTANCE_SERVER_URL, expect 202"
        id: step_b_post
        if: ${{ vars.ACCEPTANCE_SERVER_URL != '' }}
        continue-on-error: true
        env:
          SESSION_ID: gh-actions-m2-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          uv run --locked python - <<'PY'
          import os
          from datetime import datetime, timezone
          import httpx

          with httpx.Client(timeout=10, follow_redirects=False, trust_env=False) as client:
              response = client.post(os.environ["SERVER_URL"].rstrip("/") + "/events",
                  headers={"Authorization": "Bearer " + os.environ["TOKEN"]},
                  json={"event": "m2_acceptance_probe", "workspace": "m2-acceptance",
                        "data": {"timestamp": datetime.now(timezone.utc).isoformat(),
                                 "session_id": os.environ["SESSION_ID"]}})
              assert response.status_code == 202, "Expected POST /events -> 202"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("session_id=" + os.environ["SESSION_ID"] + "\n")
          print("POST /events -> 202")
          PY

      - name: "STEP B (optional, best-effort): poll graph read-back for created_by"
        if: ${{ vars.ACCEPTANCE_SERVER_URL != '' && steps.step_b_post.outcome == 'success' }}
        continue-on-error: true
        env:
          SESSION_ID: ${{ steps.step_b_post.outputs.session_id }}
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          import time
          import httpx

          with httpx.Client(timeout=5, follow_redirects=False, trust_env=False) as client:
              for attempt in range(10):
                  response = client.post(os.environ["SERVER_URL"].rstrip("/") + "/cypher",
                      headers={"Authorization": "Bearer " + os.environ["TOKEN"]},
                      json={"query": "MATCH (n) WHERE n.session_id = $session_id RETURN n.created_by AS created_by LIMIT 5",
                            "params": {"session_id": os.environ["SESSION_ID"]}})
                  # Historical schema-tolerant read-back remains best-effort.
                  expected = '"created_by": ' + json.dumps(os.environ["ACCEPTANCE_CONTRIBUTOR_ID"])
                  if response.status_code == 200 and expected in json.dumps(response.json()):
                      print("Graph read-back matches configured contributor")
                      break
                  time.sleep(3)
              else:
                  raise SystemExit("Could not confirm graph attribution; verify live graph schema")
          PY

      - name: "STEP C setup (optional): Azure login as Reader-only caller"
        if: ${{ vars.ACCEPTANCE_SERVER_URL != '' && vars.AZURE_READER_CLIENT_ID != '' }}
        continue-on-error: true
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_READER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: "STEP C (optional): acquire Reader-only token"
        id: reader_token
        if: ${{ vars.ACCEPTANCE_SERVER_URL != '' && vars.AZURE_READER_CLIENT_ID != '' }}
        continue-on-error: true
        run: |
          READER_TOKEN=$(az account get-access-token --scope "api://${AZURE_CLIENT_ID}/.default" --query accessToken -o tsv)
          test -n "$READER_TOKEN"
          echo "::add-mask::$READER_TOKEN"
          echo "READER_TOKEN=$READER_TOKEN" >> "$GITHUB_ENV"

      - name: "STEP C (optional negative test): mapped Reader can read but cannot write"
        id: step_c
        if: ${{ vars.ACCEPTANCE_SERVER_URL != '' && steps.reader_token.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run --locked python - <<'PY'
          import os
          import httpx

          with httpx.Client(timeout=10, follow_redirects=False, trust_env=False,
              headers={"Authorization": "Bearer " + os.environ["READER_TOKEN"]}) as client:
              base = os.environ["SERVER_URL"].rstrip("/")
              assert client.get(base + "/whoami").status_code == 200, "Reader must first pass authenticity and identity mapping"
              assert client.post(base + "/events", json={}).status_code == 403, "Reader write must fail role policy"
          print("Mapped Reader accepted on read; POST /events -> 403")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## M2 Auth Live-Token Acceptance Gate"
            echo "- A.1 shape: ${{ steps.assert_shape.outcome || 'skipped' }}"
            echo "- A.2 real MISE/resolver: ${{ steps.assert_resolver.outcome || 'skipped' }}"
            echo "- B POST: ${{ steps.step_b_post.outcome || 'skipped' }} (best-effort)"
            echo "- C mapped Reader: ${{ steps.step_c.outcome || 'skipped' }} (best-effort)"
            echo "A gates acceptance; B/C do not. Readiness/negative checks alone are not positive-token proof."
          } >> "$GITHUB_STEP_SUMMARY"